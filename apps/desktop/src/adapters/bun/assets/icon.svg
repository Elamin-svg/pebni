<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
	<!-- Pebni's logo: Pip on a round patch of valley sky -->
	<circle cx="60" cy="60" r="58" fill="#c9d4cf" />
	<g transform="translate(9 12) scale(0.85)">
		<!-- sprout -->
		<path d="M60 24 V12" stroke="#1f2622" stroke-width="4" stroke-linecap="round" />
		<path d="M60 14 C66 6 76 6 80 10 C74 16 66 17 60 14 Z" fill="#4e6a5c" />
		<!-- feet and body -->
		<ellipse cx="45" cy="101" rx="10" ry="6" fill="#1f2622" />
		<ellipse cx="75" cy="101" rx="10" ry="6" fill="#1f2622" />
		<rect x="18" y="22" width="84" height="80" rx="40" fill="#1f2622" />
		<!-- eyes -->
		<circle cx="45" cy="56" r="13" fill="#fff" />
		<circle cx="75" cy="56" r="13" fill="#fff" />
		<circle cx="47" cy="58" r="6.5" fill="#1c1c1c" />
		<circle cx="77" cy="58" r="6.5" fill="#1c1c1c" />
		<circle cx="49" cy="55" r="2" fill="#fff" />
		<circle cx="79" cy="55" r="2" fill="#fff" />
		<!-- cheeks and mouth -->
		<ellipse cx="32" cy="74" rx="7" ry="4" fill="#d9d9d6" opacity="0.6" />
		<ellipse cx="88" cy="74" rx="7" ry="4" fill="#d9d9d6" opacity="0.6" />
		<path d="M54 77 Q57 81 60 77 Q63 81 66 77" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" />
	</g>
</svg>
