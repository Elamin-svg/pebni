name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repository; it never needs to write.
permissions:
  contents: read

jobs:
  desktop:
    name: Desktop App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install
      - name: Type check
        run: bun x tsc --noEmit -p .
      - name: Unit & architectural fitness tests
        run: bun test src/core
      - name: Production frontend build
        run: bun x vite build
      - name: End-to-end browser tests
        run: node scripts/test-e2e.mjs

  web:
    name: Landing Page (Astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # npm ci installs exactly what package-lock.json pins.
      - name: Install dependencies
        run: npm ci
      - name: Astro production build
        run: npm run build
