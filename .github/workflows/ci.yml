name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  desktop:
    name: Desktop App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install
      - name: Type check
        run: bun x tsc --noEmit -p .
      - name: Unit & architectural fitness tests
        run: bun test src/core
      - name: Production frontend build
        run: bun x vite build
      - name: End-to-end browser tests
        run: node scripts/test-e2e.mjs

  web:
    name: Landing Page (Astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Astro production build
        run: npm run build
