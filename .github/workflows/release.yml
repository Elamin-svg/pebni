name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.1)"
        required: true
        type: string

# Read-only by default. Only the publish job, which runs no third-party scripts, may write.
permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Hutch, pinned three ways (bump all together with the cli= pin in apps/desktop/hutch.config.ts):
      # 1. the installer comes from a fixed commit of github.com/blackboardsh/hutch and must match its SHA256,
      # 2. the release manifest must list the reviewed archive SHA256 for this platform,
      # 3. the installer installs exactly that version and checks the archive against the manifest.
      - name: Install Hutch (pinned and verified)
        shell: pwsh
        env:
          HUTCH_VERSION: "0.30.0"
          HUTCH_INSTALLER_COMMIT: e9242de5dcbfe7af1142d51010bf3650c21833c0
          HUTCH_INSTALLER_SHA256: 185cc615d3d1b6e7156c104beb902cce3f4b9f35cb3d14df047586aa432883e7
          HUTCH_ARCHIVE_SHA256: a930849616ec5ced8c6f151180d2e2e0094d24b2f9a277dc96f1ec8feed3f031 # windows-x64
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "hutch-install.ps1"
          Invoke-WebRequest -UseBasicParsing -OutFile $installer `
            -Uri "https://raw.githubusercontent.com/blackboardsh/hutch/$env:HUTCH_INSTALLER_COMMIT/scripts/install.ps1"
          $installerHash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installerHash -ne $env:HUTCH_INSTALLER_SHA256) { throw "Hutch installer hash mismatch: $installerHash" }

          $manifest = Invoke-RestMethod -Uri "https://hutch.blackboard.sh/hutch/releases/$env:HUTCH_VERSION/manifest.json"
          $archiveHash = $manifest.platforms.'windows-x64'.archive.sha256
          if ($archiveHash -ne $env:HUTCH_ARCHIVE_SHA256) { throw "Hutch $env:HUTCH_VERSION archive hash changed: $archiveHash" }

          & ([scriptblock]::Create((Get-Content -Raw -Path $installer))) -Version $env:HUTCH_VERSION -NoModifyPath
          "$HOME\.hutch\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install desktop dependencies
        working-directory: apps/desktop
        shell: pwsh
        run: |
          hutch install
          hutch electrobun prepare

      - name: Type check & unit tests
        working-directory: apps/desktop
        shell: pwsh
        run: |
          hutch pm exec -- tsc --noEmit -p .
          hutch test src/core

      - name: Build Electrobun stable Windows release
        working-directory: apps/desktop
        shell: pwsh
        env:
          PEBNI_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
        run: hutch run build

      - name: Run headless browser E2E suite
        working-directory: apps/desktop
        shell: pwsh
        run: node scripts/test-e2e.mjs

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          if-no-files-found: error
          retention-days: 3
          path: |
            apps/desktop/artifacts/win-x64-Pebni-Setup.zip
            apps/desktop/artifacts/stable-win-x64-Pebni.tar.zst
            apps/desktop/artifacts/stable-win-x64-update.json
            apps/desktop/artifacts/stable-win-x64-checksum.json
            apps/desktop/artifacts/stable-win-x64-*.patch

  # Separate job: the write token never shares a runner with the build tools.
  publish:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-release
          path: artifacts

      - name: Publish GitHub Release with installer + Electrobun updater assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Pebni ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            artifacts/win-x64-Pebni-Setup.zip
            artifacts/stable-win-x64-Pebni.tar.zst
            artifacts/stable-win-x64-update.json
            artifacts/stable-win-x64-checksum.json
            artifacts/stable-win-x64-*.patch
