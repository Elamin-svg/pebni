name: Release Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.1)"
        required: true
        type: string

# Read-only by default. Only the publish job, which runs no third-party scripts, may write.
permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The installer is only run when its SHA256 matches the reviewed one
      # (repository variable HUTCH_INSTALLER_SHA256). A changed script stops the release.
      - name: Install Hutch (verified installer)
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ vars.HUTCH_INSTALLER_SHA256 }}
        run: |
          if (-not $env:EXPECTED_SHA256) {
            throw "Set the repository variable HUTCH_INSTALLER_SHA256 to the SHA256 of a reviewed https://hutch.sh/install.ps1."
          }
          $installer = Join-Path $env:RUNNER_TEMP "hutch-install.ps1"
          Invoke-WebRequest -Uri https://hutch.sh/install.ps1 -OutFile $installer -UseBasicParsing
          $actual = (Get-FileHash -Path $installer -Algorithm SHA256).Hash
          if ($actual -ne $env:EXPECTED_SHA256.Trim().ToUpperInvariant()) {
            throw "Hutch installer hash mismatch. Expected $env:EXPECTED_SHA256, got $actual. Review the new script before updating the variable."
          }
          Invoke-Expression (Get-Content -Raw -Path $installer)
          "$HOME\.hutch\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install desktop dependencies
        working-directory: apps/desktop
        shell: pwsh
        run: hutch install

      - name: Type check & unit tests
        working-directory: apps/desktop
        shell: pwsh
        run: |
          hutch pm exec -- tsc --noEmit -p .
          hutch test src/core

      - name: Build Electrobun stable Windows release
        working-directory: apps/desktop
        shell: pwsh
        env:
          PEBNI_RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/latest/download
        run: hutch run build

      - name: Run headless browser E2E suite
        working-directory: apps/desktop
        shell: pwsh
        run: node scripts/test-e2e.mjs

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          if-no-files-found: error
          retention-days: 3
          path: |
            apps/desktop/artifacts/win-x64-Pebni-Setup.zip
            apps/desktop/artifacts/stable-win-x64-Pebni.tar.zst
            apps/desktop/artifacts/stable-win-x64-update.json
            apps/desktop/artifacts/stable-win-x64-checksum.json
            apps/desktop/artifacts/stable-win-x64-*.patch

  # Separate job: the write token never shares a runner with the build tools.
  publish:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-release
          path: artifacts

      - name: Publish GitHub Release with installer + Electrobun updater assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Pebni ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            artifacts/win-x64-Pebni-Setup.zip
            artifacts/stable-win-x64-Pebni.tar.zst
            artifacts/stable-win-x64-update.json
            artifacts/stable-win-x64-checksum.json
            artifacts/stable-win-x64-*.patch
